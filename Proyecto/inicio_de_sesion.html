<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/inicio_sesión.css">
    <link rel="stylesheet" href="css/gonzalo.css">
    <title>Inicio de Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <section class="contenedor-datos">
        <div class="linea"></div>
        <div class="info">
            <div class="loguito">
                <i class="fa-solid fa-fire"></i>
            </div>
            <span class="etiqueta-subtitulo">TRADICIÓN & MAESTRÍA</span>
            <div class="texto-marca">
                <h1>SAN JUAN</h1>
                <span class="sub-marca">CARNICERÍA</span>
            </div>

            <div class="encabezado-login">
                <h2>Administración Web</h2>
                <p>Acceso al Administrador del Sitio Web</p>
            </div>

    <form class="formulario-login" id="formLogin">
        <div class="grupo-input">
            <label for="usuario">Correo</label>
            <input type="text" id="usuario" name="usuario" placeholder="usuario@ejemplo.com" required>
        </div>

        <div class="grupo-input">
            <div class="label-password">
                <label for="password">Contraseña</label>
                <a href="" class="olvicon">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="grupo-checkbox">
            <input type="checkbox" id="recordar" name="recordar">
            <label for="recordar">Recordar sesión en este equipo</label>
        </div>

        <button type="submit" class="boton-ingresar">Ingresar</button>
        <div style="text-align: center; margin-top: 15px;">
            <a href="registro.html" style="color: #8b0000; text-decoration: none; font-size: 14px;">¿No tienes cuenta? Regístrate aquí</a>
        </div>  
    </form>

    <div id="mensajeError" style="color: red; margin-top: 10px; text-align: center;"></div>
    </section>
    <footer class="footer-login">
        <p>Panel de Administración Web  •  Carnicería San Juan</p>
    </footer>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensajeError');

            mensajeError.textContent = "Verificando acceso...";

            try {
                const respuesta = await fetch('validar_login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ usuario, password })
                });

                const resultado = await respuesta.json();

                if (resultado.exito) {
                    // Redirección directa y única a index.php para todos
                    window.location.href = 'index.php'; 
                } else {
                    mensajeError.textContent = resultado.mensaje || "Usuario o contraseña incorrectos.";
                }
            } catch (error) {
                console.error("Error en la petición:", error);
                mensajeError.textContent = "Ocurrió un error al conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
